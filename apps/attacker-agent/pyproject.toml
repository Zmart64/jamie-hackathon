[project]
name = "attacker-agent"
version = "0.1.0"
description = "Bounded black-box attacker with live evidence events for the hackathon."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "playwright==1.63.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "uvicorn==0.53.0",
]

[project.scripts]
attacker-agent = "attacker_agent.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
