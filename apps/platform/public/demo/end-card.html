<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strain · Break it before they do.</title>
    <style>
      /* Demo video end card. Works via the dev server (/demo/end-card.html)
         and opened directly as a file; asset paths are relative on purpose. */
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("../fonts/ibm-plex-sans-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #0b0b0f;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 6vh 6vw;
        box-sizing: border-box;
      }
      .lockup {
        display: grid;
        gap: 3.5vh;
        width: min(64vw, 1100px);
      }
      .wordmark {
        width: 100%;
        height: auto;
        display: block;
      }
      /* The "S" of STRAIN starts 23.9% into the wordmark SVG (x≈1103 of
         4615). Left-align the tagline to it so it locks to the word, not to
         the optical center of mark + letters. */
      .tagline {
        margin: 0;
        padding-left: 23.9%;
        text-align: left;
        font-size: clamp(22px, 2.7vw, 50px);
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lockup">
        <img class="wordmark" src="../brand/wordmark-light.svg" alt="Strain" />
        <p class="tagline">Break it before they do.</p>
      </div>
    </main>
  </body>
</html>
