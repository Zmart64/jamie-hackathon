version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Keep Node types on the runtime's major; revisit when upgrading Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      compatible-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
