name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Gitleaks checks history, including secrets deleted later.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Both releases are at least 30 days old. Exercise setup without activation
          # or cached tool installs, just as on a new engineer's machine.
          version: "2026.9.12"
          install: false
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false
      - run: make setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make check
